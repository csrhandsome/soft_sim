prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "aliyun" }
isaaclab = { path = "../../.deps/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "../../.deps/IsaacLab/source/isaaclab_assets", editable = true }
nvidia-curobo = { path = "../../.deps/curobo", editable = true }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
default = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
explicit = false

# Upstream wheels expose different metadata on Windows and Linux.
# Resolve using the installed Linux wheel metadata, matching this Linux-only project.
