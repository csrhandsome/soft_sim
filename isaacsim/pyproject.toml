[project]
name = "soft-sim-isaacsim"
version = "0.1.0"
description = "Isolated Isaac Sim development environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaacsim[all,extscache]",
    "numpy>=2.2",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"
# Isaac Sim pins pre-release dependencies, including OpenCV and tinyobjloader.
prerelease = "allow"
# Resolve across both trusted indexes when the mirror lacks a required version.
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
# NVIDIA hosts Isaac Sim wheels and dependencies missing from the mirror.
name = "nvidia"
url = "https://pypi.nvidia.com"
default = true
