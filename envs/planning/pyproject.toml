  "charset-normalizer==3.5.2",
  "contourpy==1.3.2",
  "cycler==0.12.1",
  "fonttools==4.65.0",
  "idna==3.20",
  "imageio==2.34.2",
  "kiwisolver==1.5.1",
  "lxml==6.1.3",
  "matplotlib==3.10.9",
  "mplib==0.2.1",
  "networkx==3.4.2",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "packaging==26.3",
  "pillow==11.3.0",
  "pyparsing==3.3.3",
  "pyperclip==1.11.0",
  "python-dateutil==3.0.0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "rtree==1.4.1",
  "sapien==3.0.0b1",
  "scipy==1.10.1",
  "six==1.17.0",
  "toppra==0.6.11",
  "transforms3d==0.4.2",
  "trimesh==4.4.3",
