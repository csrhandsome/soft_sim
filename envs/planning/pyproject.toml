[project]
name = "soft-sim-planning"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4", "scipy==1.10.1", "mplib==0.2.1", "sapien==3.0.0b1",
  "trimesh==4.4.3", "pillow==11.3.0", "pyyaml==6.0.3", "rtree==1.4.1",
  "transforms3d==0.4.2", "imageio==2.34.2",
]

