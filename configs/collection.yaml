# Unified RoboDojo soft-finger collection manifest (default TPU 90A, success-only).
# Enable tasks as they are adapted and verified; missing inputs or unsupported tasks
# are reported explicitly without substitution.

defaults:
  material: bambu_tpu_90a
  success_only: true
  attempts_per_seed: 1

tasks:
