[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-sim"
version = "0.2.0"
description = "RoboDojo dual-X5 soft-finger simulation, planning, capture and validation"
# The package is shared by every runtime environment (3.10 - 3.12). Concrete
# NumPy/SciPy versions are pinned per environment, not here.
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pillow>=11",
    "charset-normalizer>=3.3",
    "trimesh>=4.4",
    "rtree>=1.3",
    # Unit tests for the RGB stability checks import OpenCV directly.
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Extra packages used only by the offline validation plots.
plots = ["matplotlib>=3.10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["soft_sim*"]

[tool.uv]
# Pin the validated versions of the root development environment without
# forcing them onto Python 3.10, which the planning environment uses. Every
# environment keeps its own lock file; they are never solved together.
constraint-dependencies = [
    "numpy==2.3.4; python_version >= '3.11'",
    "scipy==1.16.3; python_version >= '3.11'",
    "pillow==11.3.0",
    "charset-normalizer==3.3.2",
]

[tool.soft-sim.source-repositories.isaaclab]
url = "https://github.com/yuechen0614/IsaacLab"
rev = "afca7b09d60d8beb9c1cb28b43066499940b969b"
path = ".deps/IsaacLab"

[tool.soft-sim.source-repositories.curobo]
url = "https://github.com/yuechen0614/curobo"
rev = "d17b54ce32cba095c0b000c4c58777075d11de0e"
path = ".deps/curobo"

[tool.soft-sim.source-repositories.robodojo]
url = "https://github.com/RoboDojo-Benchmark/RoboDojo.git"
rev = "f57e1633ffed59761bc8e568cfe7530c4b33381c"
path = "third_party/RoboDojo"
